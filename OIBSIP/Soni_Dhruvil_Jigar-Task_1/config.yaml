project_name: iris-flower-classification

paths:
  raw_data: data/raw/iris.csv
  processed_data: data/processed/cleaned_and_encoded_iris.csv
  reports_dir: data/reports
  models_dir: models
  logs_dir: logs
  scaler_path: models/scaler.pkl
  best_model_path: models/best_model.pkl
  training_log: logs/training.log
  mlruns_dir: mlruns

data:
  feature_columns:
    - sepal_length
    - sepal_width
    - petal_length
    - petal_width
  target_column: species
  raw_column_map:
    Id: id
    SepalLengthCm: sepal_length
    SepalWidthCm: sepal_width
    PetalLengthCm: petal_length
    PetalWidthCm: petal_width
    Species: species
  species_to_label:
    setosa: 0
    versicolor: 1
    virginica: 2
  label_to_species:
    0: setosa
    1: versicolor
    2: virginica
  feature_bounds:
    sepal_length: [4.0, 8.5]
    sepal_width: [2.0, 4.5]
    petal_length: [1.0, 7.5]
    petal_width: [0.1, 3.0]

training:
  random_state: 42
  test_size: 0.2
  cv_folds: 5
  n_jobs: -1
  scoring:
    - accuracy
    - precision_macro
    - recall_macro
    - f1_macro
  models:
    logistic_regression:
      C: 1.0
      max_iter: 1000
    decision_tree:
      max_depth: 5
    random_forest:
      n_estimators: 200
      max_depth: 6
    svm:
      C: 2.0
      kernel: rbf
      probability: true
    knn:
      n_neighbors: 5
    gradient_boosting:
      n_estimators: 200
      learning_rate: 0.05
